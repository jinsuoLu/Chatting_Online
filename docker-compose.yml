services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-chatting_online}"
      POSTGRES_USER: "${POSTGRES_USER:-chatting}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-chatting}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chatting_online}?schema=public"
      REDIS_URL: redis://redis:6379
      API_PORT: 3001
      WEB_ORIGIN: "${WEB_ORIGIN:-https://localhost}"
      PUBLIC_APP_URL: "${PUBLIC_APP_URL:?set PUBLIC_APP_URL}"
      APP_VERSION: "${APP_VERSION:-dev}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  worker:
    build:
      context: .
      dockerfile: deploy/worker.Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-chatting}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chatting_online}?schema=public"
      REDIS_URL: redis://redis:6379
      MESSAGE_RETENTION_DAYS: "${MESSAGE_RETENTION_DAYS:-30}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  backup:
    build:
      context: .
      dockerfile: deploy/backup.Dockerfile
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-chatting}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chatting_online}"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-14}"
      BACKUP_ALERT_WEBHOOK: "${BACKUP_ALERT_WEBHOOK:-}"
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:?set NEXT_PUBLIC_API_BASE_URL}"
    expose:
      - "3000"
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: "${DOMAIN:?set DOMAIN}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  postgres-data: {}
  redis-data: {}
  caddy-data: {}
  caddy-config: {}